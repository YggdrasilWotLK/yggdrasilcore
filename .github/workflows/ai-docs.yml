name: ai-docs

# C++ API docs. Code branch is read-only; script, cache, and Pages
# artifact live on the `docs` branch. This file must live on the default
# branch to run; add it via web UI
# (PATs without `workflow` scope cannot push workflow files).
#
# - Ollama + 4B model on the runner (CPU, no keys, no GPU).
# - Incremental over the hash cache on the docs branch (limit caps LLM calls).

on:
  push:
    branches: ['*master*']
    paths: ["src/server/game/**", "src/common/**"]
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model
        default: qwen3.5:4b
        required: false
      limit:
        description: Max new LLM calls (0 = unlimited)
        default: "200"
        required: false

permissions:
  contents: write # push the cache back to the docs branch (never the code branch)
  pages: write
  id-token: write

concurrency:
  group: ai-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out code (read-only)
        uses: actions/checkout@v4
        with: {fetch-depth: 50}

      - name: Check out docs branch (script + cache)
        uses: actions/checkout@v4
        with: {ref: docs, path: site}

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Pull model and serve
        run: |
          ollama pull "${{ inputs.model || 'qwen3.5:4b' }}"
          (ollama serve &>/tmp/ollama.log & sleep 8; ollama list)

      - name: Generate docs
        run: |
          ARGS="--root . --cache site/docs/ai-cache.json --out site/docs/dist --model ${{ inputs.model || 'qwen3.5:4b' }}"
          if [ "${{ inputs.limit || '200' }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit || '200' }}"
          fi
          python3 site/docs/gen_ai.py $ARGS

      - name: Commit cache back to docs branch
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai-cache.json
          if git diff --cached --quiet; then
            echo "No cache changes"
          else
            git commit -m "ai-docs: refresh cache [skip ci]"
            git push origin docs
          fi

      - uses: actions/upload-pages-artifact@v3
        with: {path: site/docs/dist}

      - id: deployment
        uses: actions/deploy-pages@v4
