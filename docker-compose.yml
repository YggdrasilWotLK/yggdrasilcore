# docker-compose.yml for AzerothCore.
#
# Start the server with `docker compose up -d --build`
#
# Don't make changes this file! make a `docker-compose.override.yml` and make your
# changes there instead.

services:
  yggdrasilcore-database:
    container_name: yggdrasilcore-database
    image: mysql:8.3
    networks:
      - yggdrasilcore-network
    ports:
      - ${DOCKER_DB_EXTERNAL_PORT:-3306}:3306
    environment:
      - MYSQL_ROOT_PASSWORD=${DOCKER_DB_ROOT_PASSWORD:-password}
    volumes:
      - type: volume
        source: yggdrasilcore-database
        target: /var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute \"SHOW DATABASES;\""
      interval: 5s
      timeout: 10s
      retries: 40

  yggdrasilcore-db-import:
    container_name: yggdrasilcore-db-import
    image: yggdrasilwotlk/yggdrasilcore-wotlk-db-import:${DOCKER_IMAGE_TAG:-master}
    networks:
      - yggdrasilcore-network
    build:
      context: .
      target: db-import
      dockerfile: apps/docker/Dockerfile
      args:
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-ycore}
    environment:
      YC_DATA_DIR: "/azerothcore/env/dist/data"
      YC_LOGS_DIR: "/azerothcore/env/dist/logs"
      YC_LOGIN_DATABASE_INFO: "yggdrasilcore-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};ycore_auth"
      YC_WORLD_DATABASE_INFO: "yggdrasilcore-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};ycore_world"
      YC_CHARACTER_DATABASE_INFO: "yggdrasilcore-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};ycore_characters"
    volumes:
      - ${DOCKER_VOL_ETC:-./env/dist/etc}:/azerothcore/env/dist/etc
      # [osxfs optimization]: https://stackoverflow.com/a/63437557/1964544
      - ${DOCKER_VOL_LOGS:-./env/dist/logs}:/azerothcore/env/dist/logs:delegated
    depends_on:
      yggdrasilcore-database:
        condition: service_healthy
        
  yggdrasilcore-worldserver:
    command: gdb -x /azerothcore/gdb.conf --batch /azerothcore/env/dist/bin/worldserver
    container_name: yggdrasilcore-worldserver
    image: yggdrasilwotlk/yggdrasilcore-wotlk-worldserver:${DOCKER_IMAGE_TAG:-master}
    build:
      context: .
      target: worldserver
      dockerfile: apps/docker/Dockerfile
      args:
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-ycore}
    networks:
      - yggdrasilcore-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    env_file:
        ${DOCKER_YC_ENV_FILE:-conf/dist/env.yc}
    environment:
      YC_DATA_DIR: "/azerothcore/env/dist/data"
      YC_LOGS_DIR: "/azerothcore/env/dist/logs"
      YC_LOGIN_DATABASE_INFO: "yggdrasilcore-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};ycore_auth"
      YC_WORLD_DATABASE_INFO: "yggdrasilcore-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};ycore_world"
      YC_CHARACTER_DATABASE_INFO: "yggdrasilcore-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};ycore_characters"
      YC_SHADOWS_DATABASE_INFO: "yggdrasilcore-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};ycore_shadows"
    ports:
      - ${DOCKER_WORLD_EXTERNAL_PORT:-8085}:8085
      - ${DOCKER_SOAP_EXTERNAL_PORT:-7878}:7878
    volumes:
      - ${DOCKER_VOL_ETC:-./env/dist/etc}:/azerothcore/env/dist/etc
      # [osxfs optimization]: https://stackoverflow.com/a/63437557/1964544
      - ${DOCKER_VOL_LOGS:-./env/dist/logs}:/azerothcore/env/dist/logs:delegated
      # client data
      - ${DOCKER_VOL_DATA:-yggdrasilcore-client-data}:/azerothcore/env/dist/data/:ro
    depends_on:
      yggdrasilcore-database:
        condition: service_healthy
      yggdrasilcore-db-import:
        condition: service_completed_successfully
      yggdrasilcore-client-data-init:
        condition: service_completed_successfully

  yggdrasilcore-authserver:
    container_name: yggdrasilcore-authserver
    image: yggdrasilwotlk/yggdrasilcore-wotlk-authserver:${DOCKER_IMAGE_TAG:-master}
    build:
      context: .
      target: authserver
      dockerfile: apps/docker/Dockerfile
      args:
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-ycore}
    networks:
      - yggdrasilcore-network
    tty: true
    restart: unless-stopped
    env_file:
        ${DOCKER_YC_ENV_FILE:-conf/dist/env.yc}
    environment:
      YC_LOGS_DIR: "/azerothcore/env/dist/logs"
      YC_TEMP_DIR: "/azerothcore/env/dist/temp"
      YC_LOGIN_DATABASE_INFO: "yggdrasilcore-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};ycore_auth"
    volumes:
      - ${DOCKER_VOL_ETC:-./env/dist/etc}:/azerothcore/env/dist/etc
      # [osxfs optimization]: https://stackoverflow.com/a/63437557/1964544
      - ${DOCKER_VOL_LOGS:-./env/dist/logs}:/azerothcore/env/dist/logs:delegated
    ports:
      - ${DOCKER_AUTH_EXTERNAL_PORT:-3724}:3724
    depends_on:
      yggdrasilcore-database:
        condition: service_healthy
      yggdrasilcore-db-import:
        condition: service_completed_successfully

  yggdrasilcore-client-data-init:
    container_name: yggdrasilcore-client-data-init
    image: yggdrasilwotlk/yggdrasilcore-wotlk-client-data:${DOCKER_IMAGE_TAG:-master}
    build:
      context: .
      target: client-data
      dockerfile: apps/docker/Dockerfile
      args:
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-ycore}
    volumes:
      - ${DOCKER_VOL_CLIENT_DATA:-yggdrasilcore-client-data}:/azerothcore/env/dist/data

  # used for extracting maps from files shipped with game client
  # Most of the time this shouldn't be needed
  yggdrasilcore-tools:
    container_name: yggdrasilcore-tools
    image: yggdrasilwotlk/yggdrasilcore-wotlk-tools:${DOCKER_IMAGE_TAG:-master}
    build:
      context: .
      target: tools
      dockerfile: apps/docker/Dockerfile
      args:
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-ycore}
    working_dir: /azerothcore/env/client/
    volumes:
      # this is not the directory of the extracted data! It's the client folder used by the extractors
      - ${DOCKER_YC_CLIENT_FOLDER:-./var/client}:/azerothcore/env/dist/bin/Data
    # Activate with `docker compose --profile tools ...`
    profiles: [tools]

volumes:
  yggdrasilcore-database:
  yggdrasilcore-client-data:

networks:
  yggdrasilcore-network:
