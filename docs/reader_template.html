<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yggdrasilcore C++ API</title>
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" href="favicon.png">
<style>
YLA_CSS_PLACEHOLDER
</style>
<style>
/* Fluid layout: sidebars size to content, everything scales with viewport. */
#app{grid-template-columns:auto minmax(0,1fr)}
#sidebar{grid-template-columns:max-content max-content;max-width:72vw;transition:max-width .25s ease,transform .2s ease}
@media (max-width:900px){
#app{grid-template-columns:1fr}
#sidebar{grid-template-columns:max-content max-content}
}
@media (min-width:901px){
#app.sidebar-collapsed #sidebar{max-width:0;border-right-color:transparent}
#app.sidebar-collapsed #sidebar nav{overflow:hidden}
}
#class-panel,#method-panel{min-width:0}
.tree-link,.method-item{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-link{min-width:0}
.method-item{min-width:0}
#class-panel{max-width:30vw}
#method-panel{max-width:42vw}
.method-desc-text,.class-desc{max-width:none}
/* Additions in mod-yla variables. */
.star{color:var(--muted);font-size:12px;margin-left:6px}
.cnt{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:0 7px;margin-left:6px;white-space:nowrap;flex:none}
.src-link{font-size:12px;color:var(--muted);margin-top:10px}
.src-link a{color:var(--purple);text-decoration:none}
.src-link a:hover{text-decoration:underline}
.hero{max-width:min(760px,100%);margin:0 auto;padding:8vh 4vw 4vh;text-align:center}
.hero img{max-width:min(100%,480px);height:auto;display:block;margin:0 auto 18px}
.hero .eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--purple);margin-bottom:10px}
.hero h1{font-size:clamp(30px,4.5vw,44px);margin:0 0 12px}
.hero .tagline{font-size:clamp(14px,1.6vw,17px);color:var(--muted);line-height:1.7;margin:0 auto;max-width:min(600px,100%)}
.cta-row{display:flex;gap:10px;margin:22px 0 6px;flex-wrap:wrap;justify-content:center}
.cta{border:1px solid var(--purple2);border-radius:20px;padding:8px 22px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;background:none;color:var(--text);font-family:inherit}
.cta.primary{background:var(--purple2);color:#fff}
.cta:hover{border-color:var(--purple3);color:var(--purple3)}
.cta.primary:hover{background:var(--purple3);color:#fff}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0;justify-content:center}
.stat{border:1px solid var(--border);border-radius:var(--radius);padding:12px 22px;background:var(--surface2)}
.stat b{font-size:24px;display:block;color:var(--purple3)}
.stat span{font-size:12px;color:var(--muted)}
.home-links{margin-top:10px;text-align:center}
.home-links a{color:var(--purple);text-decoration:none}
.home-links a:hover{text-decoration:underline}
footer#foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);
 color:var(--muted);font-size:12px;padding:8px 16px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;z-index:60}
#content{padding-bottom:60px}
.proto-more{font-size:11px;color:var(--muted);margin-left:8px}
</style>
</head><body>
<div id="app">
<header id="topbar">
  <button id="hamburger" aria-label="Toggle sidebar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <a id="logo" href="?">
    <span>Yggdrasilcore C++ API</span>
  </a>
  <div id="search-wrap">
    <svg id="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
    </svg>
    <input id="search" type="text" placeholder="Search classes and methods…"
      autocomplete="off" spellcheck="false">
    <div id="search-results"></div>
  </div>
  <button id="theme-toggle" aria-label="Toggle theme">
    <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </svg>
    <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</header>
<aside id="sidebar">
  <div id="class-panel">
    <div id="sidebar-header">Classes</div>
    <div id="sidebar-tree"></div>
  </div>
  <div id="method-panel">
    <div id="method-header"></div>
    <nav id="method-list"></nav>
  </div>
</aside>
<div id="sidebar-overlay"></div>
<main id="main"><section id="content"></section></main>
</div>
<footer id="foot"><span>* Methods marked with ★ had their explanations generated by FOOT_MODEL.</span><span>© FOOT_YEAR Yggdrasilcore</span></footer>
<script>
const D=DATA_PLACEHOLDER,H=HIER_PLACEHOLDER,SRC_BASE="SRC_BASE_PLACEHOLDER";
const content=document.getElementById("content"),treeBox=document.getElementById("sidebar-tree"),
 mHeader=document.getElementById("method-header"),mList=document.getElementById("method-list"),
 q=document.getElementById("search"),res=document.getElementById("search-results"),
 app=document.getElementById("app");
const params=new URLSearchParams(location.search);
let cur=params.get("class"),target=params.get("method");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const allClasses=[...new Set(D.map(e=>e.class))].sort();
const cset=new Set(allClasses);
function fmt(s){let h=esc(s);
 h=h.replace(/`([^`]+)`/g,'<code class="inline-code">$1</code>');
 h=h.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
 h=h.replace(/\[(\w+):(\w+)\]/g,(m,c,mn)=>'<a class="doc-link" href="?class='+encodeURIComponent(c)+'&method='+encodeURIComponent(mn)+'">'+c+":"+mn+"</a>");
 h=h.replace(/\[(\w+)\]/g,(m,c)=>cset.has(c)?'<a class="doc-link" href="?class='+encodeURIComponent(c)+'">'+c+"</a>":m);
 return h.replace(/\n/g,"<br>");}
function ancestors(cls){const seen=new Set(),stack=[...(H[cls]?H[cls].bases:[])];
 while(stack.length){const b=stack.pop();if(!b||seen.has(b))continue;seen.add(b);
  if(H[b])stack.push(...H[b].bases);}return seen;}
function normSig(s){return s.replace(/=[^,)]*/g,"").replace(/\s+/g," ").trim();}
function groupsFor(cls){const anc=ancestors(cls),seen=new Set(),byName={};
 const push=(e,inh)=>{const k=e.name+"|"+normSig(e.sig);if(seen.has(k))return;seen.add(k);
  (byName[e.name]||(byName[e.name]=[])).push({e:e,inh:inh});};
 D.forEach(e=>{if(e.class===cls)push(e,null);});
 anc.forEach(a=>{D.forEach(e=>{if(e.class===a)push(e,a);});});
 return Object.keys(byName).sort().map(n=>({name:n,items:byName[n]}));}
function srcLink(e){const L=e.impl||{file:e.file,line:e.line};
 const w=document.createElement("div");w.className="src-link";
 const a=document.createElement("a");a.href=SRC_BASE+L.file+"#L"+L.line;
 a.textContent=L.file+":"+L.line;a.target="_blank";a.rel="noopener";w.appendChild(a);return w;}
function methodCard(cls,g,showInh){const d=document.createElement("div");
 const allInh=g.items.every(x=>x.inh);
 d.className="method-card"+(allInh?" inherited":"");
 d.id="m-"+cls+"-"+g.name;
 const t=document.createElement("div");t.className="method-name";t.textContent=cls+"::"+g.name;
 if(g.items.some(x=>x.e.ai)){const s=document.createElement("span");s.className="star";s.textContent="★";t.appendChild(s);}
 if(allInh&&showInh){const b=document.createElement("span");b.className="method-inherited-badge";
  b.textContent="inherited from "+g.items[0].inh;t.appendChild(b);}
 d.appendChild(t);
 if(g.items.length>1){const n=document.createElement("span");n.className="proto-more";
  n.textContent=g.items.length+" signatures";d.appendChild(n);}
 const pl=document.createElement("div");pl.className="proto-list";
 g.items.forEach(x=>{const p=document.createElement("span");p.className="proto-badge";p.textContent=x.e.sig;pl.appendChild(p);});
 d.appendChild(pl);
 g.items.forEach(x=>{const e=x.e;
  if(x.inh&&!allInh){const n=document.createElement("div");n.className="tag-label";n.textContent="inherited from "+x.inh;d.appendChild(n);}
  const p=document.createElement("div");p.className="method-desc-text";p.innerHTML=fmt(e.desc||"(no description)");d.appendChild(p);
  d.appendChild(srcLink(e));});
 return d;}
function renderTree(){
 treeBox.innerHTML="";
 const kids={},hasKids=new Set();
 allClasses.forEach(c=>{const bs=((H[c]||{}).bases||[]).filter(b=>cset.has(b));
  if(!bs.length)(kids[""]||(kids[""]=[])).push(c);
  else bs.forEach(b=>{(kids[b]||(kids[b]=[])).push(c);hasKids.add(b);});});
 let collapsed={};try{collapsed=JSON.parse(localStorage.getItem("ygg-cpp-tree")||"{}");}catch(e){collapsed={};}
 function save(){try{localStorage.setItem("ygg-cpp-tree",JSON.stringify(collapsed));}catch(e){}}
 function node(box,cls,depth,trail){
  if(trail.includes(cls))return;
  const n=document.createElement("div");n.className="tree-node";n.style.paddingLeft=(8+depth*12)+"px";
  if(hasKids.has(cls)){const ar=document.createElement("span");ar.className="tree-arrow";
   ar.textContent=collapsed[cls]?"▸":"▾";
   ar.onclick=()=>{collapsed[cls]=!collapsed[cls];save();renderTree();};
   n.appendChild(ar);}
  else{const sp=document.createElement("span");sp.className="tree-indent";n.appendChild(sp);}
  const a=document.createElement("a");a.className="tree-link"+(cls===cur?" active":"");
  a.href="?class="+encodeURIComponent(cls);a.textContent=cls;n.appendChild(a);
  const ct=document.createElement("span");ct.className="class-count";
  ct.textContent=D.filter(e=>e.class===cls).length;n.appendChild(ct);
  box.appendChild(n);
  if(hasKids.has(cls)&&!collapsed[cls])(kids[cls]||[]).sort().forEach(k=>node(box,k,depth+1,trail.concat(cls)));}
 (kids[""]||[]).sort().forEach(c=>node(treeBox,c,0,[]));}
function renderMethods(){
 mList.innerHTML="";
 if(!cur||!cset.has(cur)){
  mHeader.textContent="All Methods";
  const seen=new Set();
  [...D].sort((a,b)=>a.name.localeCompare(b.name)||a.class.localeCompare(b.class)).forEach(e=>{
   if(seen.has(e.name))return;seen.add(e.name);
   const a=document.createElement("a");a.className="method-item";
   a.href="?class="+encodeURIComponent(e.class)+"&method="+encodeURIComponent(e.name);
   const dot=document.createElement("span");dot.className="own-dot";a.appendChild(dot);
   const nm=document.createElement("span");nm.textContent=e.name;a.appendChild(nm);
   const cl=document.createElement("span");cl.style.cssText="font-size:11px;color:var(--muted);margin-left:4px;";
   cl.textContent=e.class;a.appendChild(cl);mList.appendChild(a);});
  return;}
 mHeader.textContent=cur+" Methods";
 const ms=groupsFor(cur),hasInh=ms.some(g=>g.items[0].inh);
 const mp=document.getElementById("method-panel");
 mp.querySelectorAll(".inh-switch").forEach(x=>x.remove());
 if(hasInh){const t=document.createElement("button");t.className="inh-toggle inh-switch";
  t.textContent="Show inherited";
  t.setAttribute("aria-pressed",document.body.classList.contains("hide-inherited")?"false":"true");
  t.onclick=()=>{const h=document.body.classList.toggle("hide-inherited");t.setAttribute("aria-pressed",h?"false":"true");};
  mp.insertBefore(t,mList);}
 ms.forEach(g=>{const own=!g.items[0].inh;
  const a=document.createElement("a");
  a.className="method-item"+(own?"":" inherited")+(g.name===target?" active":"");
  a.href="?class="+encodeURIComponent(cur)+"&method="+encodeURIComponent(g.name);
  const dot=document.createElement("span");dot.className=own?"own-dot":"inh-dot";a.appendChild(dot);
  const nm=document.createElement("span");nm.textContent=g.name;a.appendChild(nm);
  if(g.items.length>1){const c=document.createElement("span");c.className="cnt";c.textContent="×"+g.items.length;a.appendChild(c);}
  mList.appendChild(a);});}
function renderHome(){
 const docd=D.filter(e=>e.desc).length;
 content.innerHTML="";
 const w=document.createElement("div");w.className="hero";
 const im=document.createElement("img");im.src="logo.png";im.alt="Yggdrasilcore";im.onerror=()=>im.remove();w.appendChild(im);
 const k=document.createElement("div");k.className="eyebrow";k.textContent="Core API reference";w.appendChild(k);
 const h=document.createElement("h1");h.textContent="Yggdrasilcore C++ API";w.appendChild(h);
 const tag=document.createElement("p");tag.className="tagline";
 tag.textContent="An emulation framework for hosting open-source game servers for the WotLK 3.3.5a client — every class and method, searchable, with inheritance resolved and each function explained.";
 w.appendChild(tag);
 const cta=document.createElement("div");cta.className="cta-row";
 const b1=document.createElement("button");b1.className="cta primary";b1.textContent="Browse classes";
 b1.onclick=()=>{const f=document.querySelector("#sidebar-tree .tree-link");if(f)f.focus();document.getElementById("search").focus();};
 cta.appendChild(b1);
 const b2=document.createElement("a");b2.className="cta";b2.textContent="View source";b2.href="https://github.com/YggdrasilWotLK/yggdrasilcore";cta.appendChild(b2);
 w.appendChild(cta);
 const st=document.createElement("div");st.className="stat-row";
 [["Methods",D.length],["Classes",allClasses.length],["Documented",docd]].forEach(s=>{
  const d=document.createElement("div");d.className="stat";
  const b=document.createElement("b");b.textContent=s[1];d.appendChild(b);
  const sp=document.createElement("span");sp.textContent=s[0];d.appendChild(sp);st.appendChild(d);});
 w.appendChild(st);
 const links=document.createElement("p");links.className="home-links";
 [["Yggdrasil WoW","https://yggdrasilwow.com/"],
  ["Source code","https://github.com/YggdrasilWotLK/yggdrasilcore"],
  ["Lua API docs","https://yggdrasilwotlk.github.io/mod-yla/"]].forEach((l,i)=>{
  if(i)links.appendChild(document.createTextNode(" · "));
  const a=document.createElement("a");a.href=l[1];a.textContent=l[0];links.appendChild(a);});
 w.appendChild(links);content.appendChild(w);}
function renderClass(){
 const ms=groupsFor(cur),own=ms.filter(g=>!g.items[0].inh).length;
 content.innerHTML="";
 const h=document.createElement("h1");h.textContent=cur;content.appendChild(h);
 const bases=H[cur]?H[cur].bases:[];
 if(bases.length){const ch=document.createElement("div");ch.className="inh-chain";
  const lb=document.createElement("span");lb.className="inh-chain-label";lb.textContent="Inherits:";ch.appendChild(lb);
  bases.forEach(b=>{if(cset.has(b)){const a=document.createElement("a");a.className="inh-link";
   a.href="?class="+encodeURIComponent(b);a.textContent=b;ch.appendChild(a);}
   else{const s=document.createElement("span");s.className="inh-chain-label";s.textContent=b;ch.appendChild(s);}});
  if(ms.length-own){const t=document.createElement("button");t.className="inh-toggle";
   t.textContent="Show inherited";t.title="Toggle inherited methods";
   t.setAttribute("aria-pressed",document.body.classList.contains("hide-inherited")?"false":"true");
   t.onclick=()=>{const x=document.body.classList.toggle("hide-inherited");t.setAttribute("aria-pressed",x?"false":"true");};
   ch.appendChild(t);}
  content.appendChild(ch);}
 const bar=document.createElement("div");bar.className="method-count-bar";
 bar.innerHTML='<div class="mcb-item"><span class="mcb-dot-own"></span>'+own+' own methods</div>'
  +(ms.length-own?'<div class="mcb-item"><span class="mcb-dot-inh"></span>'+(ms.length-own)+' inherited</div>':"");
 content.appendChild(bar);
 const h2=document.createElement("h2");h2.textContent="Methods";content.appendChild(h2);
 ms.forEach(g=>content.appendChild(methodCard(cur,g,true)));}
function renderMethod(){
 const gs=groupsFor(cur).filter(g=>g.name===target);
 content.innerHTML="";
 const bc=document.createElement("div");bc.className="breadcrumb breadcrumb-title";
 const a=document.createElement("a");a.href="?class="+encodeURIComponent(cur);a.textContent=cur;bc.appendChild(a);
 const sep=document.createElement("span");sep.className="crumb-sep";sep.textContent="›";bc.appendChild(sep);
 const nm=document.createElement("span");nm.textContent=target;bc.appendChild(nm);
 content.appendChild(bc);
 const wrap=document.createElement("div");wrap.id="current-method";
 if(gs.length)wrap.appendChild(methodCard(cur,gs[0],true));
 else{const p=document.createElement("p");p.textContent="Method not found.";wrap.appendChild(p);}
 content.appendChild(wrap);}
function render(){renderTree();renderMethods();
 if(!cur||!cset.has(cur))renderHome();
 else if(target)renderMethod();
 else renderClass();
 const cEl=document.getElementById("content");
 if(target){const el=document.getElementById("m-"+cur+"-"+target);
  if(el){const cr=cEl.getBoundingClientRect(),r=el.getBoundingClientRect();
   cEl.scrollTop+=r.top-cr.top-cEl.clientHeight/2+r.height/2;}}}
/* hamburger: desktop collapses, mobile overlays (mod-yla behavior) */
const sidebar=document.getElementById("sidebar"),overlay=document.getElementById("sidebar-overlay");
const desktop=()=>window.matchMedia("(min-width: 901px)").matches;
function setCollapsed(c){app.classList.toggle("sidebar-collapsed",c);
 try{localStorage.setItem("ygg-cpp-sb",c?"1":"0");}catch(e){}}
document.getElementById("hamburger").onclick=()=>{
 if(desktop())setCollapsed(!app.classList.contains("sidebar-collapsed"));
 else{const o=!sidebar.classList.contains("open");
  sidebar.classList.toggle("open",o);overlay.classList.toggle("open",o);}};
overlay.onclick=()=>{sidebar.classList.remove("open");overlay.classList.remove("open");};
window.addEventListener("resize",()=>{
 if(!desktop()&&app.classList.contains("sidebar-collapsed"))setCollapsed(false);});
try{if(localStorage.getItem("ygg-cpp-sb")==="1"&&desktop())setCollapsed(true);}catch(e){}
/* theme toggle */
const tBtn=document.getElementById("theme-toggle"),tSun=document.getElementById("theme-icon-sun"),tMoon=document.getElementById("theme-icon-moon");
function setTheme(light){document.body.classList.toggle("light",light);
 tSun.style.display=light?"none":"";tMoon.style.display=light?"":"none";
 try{localStorage.setItem("theme",light?"light":"dark");}catch(e){}}
try{setTheme(localStorage.getItem("theme")==="light");}catch(e){}
tBtn.onclick=()=>setTheme(!document.body.classList.contains("light"));
/* search: dropdown only, view changes on click */
q.addEventListener("input",()=>{
 const v=q.value.trim().toLowerCase();
 if(!v){res.classList.remove("open");res.innerHTML="";return;}
 const ch=allClasses.filter(c=>c.toLowerCase().includes(v)).slice(0,5).map(c=>({t:"class",c:c,n:c,d:""}));
 const mh=D.filter(e=>(e.class+"::"+e.name).toLowerCase().includes(v)||
  (e.desc&&e.desc.toLowerCase().includes(v))).slice(0,25).map(e=>({t:"method",c:e.class,n:e.name,d:e.desc}));
 const hits=ch.concat(mh);
 if(!hits.length){res.classList.remove("open");res.innerHTML="";return;}
 res.innerHTML="";hits.forEach(x=>{
  const d=document.createElement("div");d.className="sr-item";
  const bg=document.createElement("span");bg.className="sr-badge "+x.t;bg.textContent=x.t;d.appendChild(bg);
  const t=document.createElement("div");
  if(x.t==="method"){const sub=document.createElement("span");sub.className="sr-class";sub.textContent=x.c+".";t.appendChild(sub);
   const nm=document.createElement("span");nm.className="sr-name";nm.textContent=x.n;t.appendChild(nm);}
  else{const nm=document.createElement("span");nm.className="sr-name";nm.textContent="Class: "+x.n;t.appendChild(nm);}
  d.appendChild(t);
  if(x.d){const ds=document.createElement("span");ds.className="sr-desc";ds.textContent=x.d;t.appendChild(ds);}
  d.onclick=()=>{res.classList.remove("open");q.value="";
   location.href=x.t==="method"
    ?"?class="+encodeURIComponent(x.c)+"&method="+encodeURIComponent(x.n)
    :"?class="+encodeURIComponent(x.n);};
  res.appendChild(d);});
 res.classList.add("open");});
document.addEventListener("click",e=>{if(!q.contains(e.target)&&!res.contains(e.target))res.classList.remove("open");});
q.addEventListener("keydown",e=>{if(e.key==="Escape"){res.classList.remove("open");q.blur();}});
render();
</script></body></html>
